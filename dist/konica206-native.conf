# Environment for konica206-native (OpenRC conf.d; see docs/native-filter-musl.md).
#
# The vendor stage is konica-native (pure libc, musl-clean) instead of the vendor
# 245igdirf.  It needs the vendor runtime data (halftone screen + ICC profiles) at
# its default path; the app execs the filter with a fixed environment, so
# KONICA_HFT/KONICA_SRGB/KONICA_GRAY overrides would NOT reach it - use a wrapper
# script instead (see test/filter-wrapper.sh).

# IPP port of this app (a CUPS queue keeps port 631).
export konica206_port=8001

export KONICA_VENDOR_FILTER=/usr/local/lib/konica/konica-native

# The PPD is optional: the page geometry, the tray map and the duplex back-side
# rule are compiled into the app, and a readable PPD overrides them.  It lives
# here (not in CUPS's tree) so a CUPS upgrade that drops PPD support cannot
# change the app's behaviour.
export KONICA_PPD=/usr/local/share/konica/KonicaMinolta-206-native.ppd

export KONICA_PDF_RENDERER=builtin
export KONICA_LISTEN=localhost
