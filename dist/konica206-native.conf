# OpenRC conf.d sample for konica206-native:
#   install -m 644 dist/konica206-native.conf /etc/conf.d/konica206-native
#
# The repo ships no OpenRC init script (for Puppy, which has no systemd either, the documented
# pattern is a /root/Startup/*.sh boot script -- see docs/install-ubuntu-debian-puppy.md).
# This file only carries the environment.
#
# konica-native needs the vendor runtime data (halftone screen + ICC profiles) at its default
# path; see docs/native-filter-musl.md.
export KONICA_VENDOR_FILTER=/usr/local/lib/konica/konica-native
