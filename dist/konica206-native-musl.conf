# systemd drop-in for konica206-native.service:
#   install -D -m 644 dist/konica206-native-musl.conf \
#     /etc/systemd/system/konica206-native.service.d/musl-native-filter.conf
#   systemctl daemon-reload && systemctl restart konica206-native
#
# A drop-in is applied after the unit, so this Environment= replaces the unit's
# KONICA_VENDOR_FILTER (the vendor 245igdirf) with the musl-clean konica-native.
# See docs/native-filter-musl.md.
#
# OpenRC: put the KONICA_VENDOR_FILTER line in /etc/conf.d/konica206-native
# (see dist/konica206-native.conf).
[Service]
Environment=KONICA_VENDOR_FILTER=/usr/local/lib/konica/konica-native
